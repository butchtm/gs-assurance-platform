# Required metadata
sonar.projectKey=uk.co.caci.iig:gold-standard-front-end
sonar.projectName=assurance-front-end
sonar.projectVersion=1.0

sonar.sources=src/
sonar.exclusions=src/__tests__/**, src/**/*.test.ts, src/**/*.test.tsx
sonar.tests=src/
sonar.test.inclusions=src/__tests__/**, src/**/*.test.ts, src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/execution-report.xml

# Encoding of the source files
sonar.sourceEncoding=UTF-8
