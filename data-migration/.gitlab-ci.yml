document-migration-job:
  stage: document_migration
  image: python:3.9
  environment:
    name: $JOB_ENVIRONMENT
  script: |
    eval $(ssh-agent -s)
    ssh-add <(echo "${BASTION_PRIVATE_KEY}" | base64 -d)
    export RCLONE_COMMAND="rclone -v copy gs_sc_azure_source:scfilestore/GSProjectDocuments gs_aws_target:gs-ssrnc-dcmts-$JOB_ENVIRONMENT"
    ssh -tt -o StrictHostKeyChecking=no -p 22 ec2-user@${DOCUMENT_MIGRATION_HOST} "$RCLONE_COMMAND"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DOCUMENT_MIGRATION_JOB'

dump_prod_db:
  stage: dump_and_restore
  <<: *dump_pg_tools
  environment:
    name: production
  script: |
    eval $(ssh-agent -s)
    ssh-add <(echo "${BASTION_PRIVATE_KEY}" | base64 -d)
    
    ssh -o StrictHostKeyChecking=no \
        -f \
        -N \
        -p ${BASTION_PORT} \
        -L 127.0.0.1:15432:${DB_HOST}:5432 \
        ${BASTION_USERNAME}@${BASTION_HOST}
    
    cd dump_prod_db
    pip install -r requirements.txt
    
    # Use the CLI tool to dump the production database
    export DUMP_AND_RESTORE_SOURCE=prod
    export PROD_ASSURANCE_DB_HOST="127.0.0.1"
    export PROD_ASSURANCE_DB_PORT="15432"
    export PROD_ASSURANCE_DB_NAME=${DB_NAME}
    export PROD_ASSURANCE_DB_USER=${DB_USER}
    export PROD_ASSURANCE_DB_PASSWORD=${DB_PASSWORD}
    
    python -m cli dump
  artifacts:
    paths:
      - dump_prod_db/dump_file.dump
    expire_in: 2 hrs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DUMP_PROD_DB_JOB'

restore_to_staging:
  stage: dump_and_restore
  <<: *dump_pg_tools
  environment:
    name: staging
  needs: ["dump_prod_db"]
  script: |
    eval $(ssh-agent -s)
    ssh-add <(echo "${BASTION_PRIVATE_KEY}" | base64 -d)
    
    ssh -o StrictHostKeyChecking=no \
        -f \
        -N \
        -p ${BASTION_PORT} \
        -L 127.0.0.1:15432:${DB_HOST}:5432 \
        ${BASTION_USERNAME}@${BASTION_HOST}
    
    cd dump_prod_db
    pip install -r requirements.txt
    
    # Use the CLI tool to clear and restore to staging database
    export DUMP_AND_RESTORE_TARGET=staging
    export STAGING_ASSURANCE_DB_NAME=${DB_NAME}
    export STAGING_ASSURANCE_DB_USER=${DB_USER}
    export STAGING_ASSURANCE_DB_HOST="127.0.0.1"
    export STAGING_ASSURANCE_DB_PORT="15432"
    export STAGING_ASSURANCE_DB_PASSWORD=${DB_PASSWORD}
    
    python -m cli clear
    python -m cli restore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DUMP_PROD_DB_JOB'