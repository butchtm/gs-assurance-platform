# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

image: cypress/browsers:node-22.17.0-chrome-138.0.7204.49-1-ff-140.0-edge-137.0.3296.93-1

stages:          # List of stages for jobs, and their order of execution
  - project setup stage
  - request setup stage
  - main stage
  - request submission stage
  - dashboards stage
  - reporting stage

# Define common variables and scripts
.default_variables: &default_variables
  variables:
    ADMIN_USERNAME: $ADMIN_USERNAME
    ADMIN_PASSWORD: $ADMIN_PASSWORD
    PD_USERNAME: $PD_USERNAME
    PD_PASSWORD: $PD_PASSWORD
    ARM_USERNAME: $ARM_USERNAME
    ARM_PASSWORD: $ARM_PASSWORD
    VVB_USERNAME: $VVB_USERNAME
    VVB_PASSWORD: $VVB_PASSWORD
    FINANCE_USERNAME: $FINANCE_USERNAME
    FINANCE_PASSWORD: $FINANCE_PASSWORD
    REVIEWER_USERNAME: $REVIEWER_USERNAME
    REVIEWER_PASSWORD: $REVIEWER_PASSWORD
    TAC_USERNAME: $TAC_USERNAME
    TAC_PASSWORD: $TAC_PASSWORD
    CYPRESS_BASE_URL: $CYPRESS_BASE_URL

.default_before_script: &default_before_script
  before_script:
    - mkdir -p reporting/${CI_JOB_NAME}
    - node -v
    - npm cache clean --force
    - npm ci
    - npm install cypress --save-dev


cache:
  key: cypress
  policy: pull-push
  paths:
    - node_modules/
    - /root/.cache/Cypress


.default_script: &default_script
  script:
    - npm run cypress:version

.default_artifacts: &default_artifacts
  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
      - cypress/fixtures/a11y/
      - cypress/fixtures/*.json
      - reporting/all-results/
      - reporting/job_summary.txt
    reports: 
      junit: reporting/${CI_JOB_NAME}/test-results.xml

default:
  tags:
    - caci



cypress_tests_projectSetup:
  stage: project setup stage
  <<: *default_before_script
  <<: *default_script
  script:
    - npm run cypress:run -- --env TAGS='@groupDS' --spec ./cypress/e2e/features/dataSetup/dataSetup.feature --browser chrome
  <<: *default_artifacts
  <<: *default_variables

