spring:
  jpa:
    properties:
      hibernate:
        default_schema: gs
        show_sql: false
        format_sql: true

  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driver-class-name: org.postgresql.Driver
    password: MySuperSafePostgresPassword
    url: jdbc:postgresql://localhost:15432/assurance_db
    username: postgres
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_XIzobZSx7

notification:
  contact-mapping:
    enabled: true

cognito:
  region.name: eu-central-1
  user-pool.id:
  app.client.id:

