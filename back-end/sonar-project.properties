sonar.projectKey=gold-standard-assurance-backend
sonar.projectName=Gold Standard Assurance Platform Backend
sonar.projectDescription=Gold Standard Assurance Platform Backend
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.coverage.jacoco.xmlReportPaths=./target/site/jacoco/jacoco.xml
sonar.java.source=21
sonar.java.libraries=.m2/repository/**/*.jar
sonar.java.test.libraries=.m2/repository/**/*.jar
sonar.junit.reportPaths=./target/surefire-reports,./target/failsafe-reports
sonar.issue.ignore.multicriteria=ig1,ig2,ig3
# Ignore java:S3958 because it is showing as a false positive, which is caused
# by a bug in sonar which is fixed in sonarqube major version 9 as discussed here:
# https://stackoverflow.com/questions/72635209/sonarqube-major-issue-refactor-code-so-that-stream-pipeline-is-used/72635975#72635975
sonar.issue.ignore.multicriteria.ig1.ruleKey=java:S3958
sonar.issue.ignore.multicriteria.ig1.resourceKey=**/*
# Always defining variables as var can be confusing in some cases as discussed here
# https://community.sonarsource.com/t/s6212-always-replacing-variable-with-var-may-be-confusing/42923
sonar.issue.ignore.multicriteria.ig2.ruleKey=java:S6212
sonar.issue.ignore.multicriteria.ig2.resourceKey=**/*
# Spring data requires some method names to include underscores so configuring this to be allowed for
# repository classes only
sonar.issue.ignore.multicriteria.ig3.ruleKey=java:S100
sonar.issue.ignore.multicriteria.ig3.resourceKey=**/*Repository.java
