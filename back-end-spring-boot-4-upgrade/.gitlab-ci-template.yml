.deployment:
  stage: deploy
  image: ${NEXUS_PREFIX}/gold_standard/back-end/pipeline:latest
  services:
    - name: docker:${DOCKER_VERSION}-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    BASE_IMAGE: ${NEXUS_PREFIX}/gold_standard/back-end/app-base:latest
    IMAGE_NAME: ${ECR_REPOSITORY_URL}/ecr-backend-api-${ENVIRONMENT}:${IMAGE_TAG}
  before_script:
    - export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
  script:
    - mvn -v
    - mvn clean package -Dmaven.test.skip=true
    - docker build -f ./docker/app.Dockerfile --build-arg BASE_IMAGE=${BASE_IMAGE} -t ${IMAGE_NAME} .
    - docker images
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION}
      | docker login --username AWS --password-stdin ${ECR_REPOSITORY_URL}
    - docker push ${IMAGE_NAME}
    - if [[ $ENVIRONMENT == "development" ]]; then aws ecs update-service --cluster assurance-services-${ENVIRONMENT} --service assurance-api-2-${ENVIRONMENT} --force-new-deployment --region ${AWS_DEFAULT_REGION}; fi