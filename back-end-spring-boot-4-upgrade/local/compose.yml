services:
  db:
    build: .
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=assurance_db
    command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "assurance_db"]
      interval: 5s
      timeout: 30s
      retries: 6

  liquibase:
    image: liquibase/liquibase
    volumes:
      - ../../data-migration/migrations:/liquibase/changelog
    command: --url="jdbc:postgresql://db:5432/assurance_db" --changeLogFile=changelog.yaml --username=postgres --password=${DB_PASSWORD:-changeme} --searchPath=./changelog --contexts="local" update
    depends_on:
      db:
        condition: service_healthy
