include:
  local: .gitlab-ci-template.yml

stages:
  - build
  - dependency-check
  - test
  - static-analysis
  - deploy

cache:
  paths:
    - .m2/repository/
    - target/

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  MVN: "mvn -B"
  DOCKER_VERSION: "24.0.6"
  SUREFIRE_REPORTS: target/surefire-reports/TEST-*.xml
  FAILSAFE_REPORTS: target/failsafe-reports/TEST-*.xml
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_IMAGE: maven:3.9.4

build:
  stage: build
  image: ${MAVEN_IMAGE}
  script:
    - $MVN clean package
  artifacts:
    expire_in: 1 week
    paths:
      - "target/classes/"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG'

license-check:
  image: ${MAVEN_IMAGE}
  stage: dependency-check
  script:
    - $MVN clean -Dlicense.failOnBlacklist=true -Dlicense.failOnMissing=true generate-resources
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.owasp-dependency-check:
  image:
    name: ${NEXUS_PREFIX}/gitlab-ci-utils/docker-dependency-check:latest
    entrypoint: [""]
  stage: dependency-check
  script:
    - >
      /usr/share/dependency-check/bin/dependency-check.sh -n --scan "./" --format ALL
      --project "gold-standard-backend" --failOnCVSS 0
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "./dependency-check-report.html"
      - "./dependency-check-report.json"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

unit-test:
  stage: test
  image: ${MAVEN_IMAGE}
  script:
    - $MVN test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/unit-test-jacoco.exec
      - ${SUREFIRE_REPORTS}
    reports:
      junit:
        - ${SUREFIRE_REPORTS}
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

integration-test:
  stage: test
  image: ${MAVEN_IMAGE}
  script:
    - $MVN verify -Dskip.unit.tests
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/integration-test-jacoco.exec
      - ${FAILSAFE_REPORTS}
    reports:
      junit:
        - ${FAILSAFE_REPORTS}
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage-report:
  stage: static-analysis
  image: ${MAVEN_IMAGE}
  script:
    - $MVN verify -Dskip.unit.tests -Dskip.integration.tests
  artifacts:
    expire_in: 7 days
    paths:
      - target/site/jacoco/
  needs:
    - unit-test
    - integration-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sonar:
  stage: static-analysis
  image: ${NEXUS_PREFIX}/gitlab-sonar
  variables:
    SONAR_PROJECT_VERSION: $CI_PIPELINE_ID
  script:
    - gitlab-sonar-scanner
  needs:
    - coverage-report
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_to_development:
  extends: .deployment
  only:
    - main
  variables:
    AWS_ACCESS_KEY_ID: "${DEV_AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${DEV_AWS_SECRET_ACCESS_KEY}"
    IMAGE_TAG: "latest"
    ECR_REPOSITORY_URL: "${DEV_ECR_REPOSITORY_URL}"
    ENVIRONMENT: "development"

deploy_to_staging:
  extends: .deployment
  variables:
    AWS_ACCESS_KEY_ID: "${STAGING_AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${STAGING_AWS_SECRET_ACCESS_KEY}"
    ECR_REPOSITORY_URL: "${STAGING_ECR_REPOSITORY_URL}"
    ENVIRONMENT: "staging"
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        IMAGE_TAG: "${CI_COMMIT_TAG}"

deploy_to_production:
  extends: .deployment
  variables:
    AWS_ACCESS_KEY_ID: "${PROD_AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${PROD_AWS_SECRET_ACCESS_KEY}"
    IMAGE_TAG: "$CI_COMMIT_TAG"
    ECR_REPOSITORY_URL: "${PRODUCTION_ECR_REPOSITORY_URL}"
    ENVIRONMENT: "production"
  rules:
    - if: '$CI_COMMIT_TAG'